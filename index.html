<script>
        const form = document.getElementById('contactForm');
        
        form.addEventListener('submit', function(e) {
            e.preventDefault(); // يمنع المتصفح من فتح صفحة formspree
            
            // إرسال البيانات في الخلفية
            fetch(form.action, {
                method: 'POST',
                body: new FormData(form),
                headers: { 'Accept': 'application/json' }
            }).then(response => {
                if (response.ok) {
                    // إخفاء النموذج وإظهار الاختيارات
                    document.getElementById('form-section').style.display = 'none';
                    document.getElementById('options-section').style.display = 'block';
                } else {
                    alert('حدث خطأ أثناء الإرسال، يرجى المحاولة لاحقاً.');
                }
            });
        });

        // باقي الدالة كما هي
        function showDetail(title, imgSrc, levels) {
            document.getElementById('detail-title').innerText = title;
            document.getElementById('detail-image').src = imgSrc;
            const container = document.getElementById('levels-container');
            container.innerHTML = '';
            
            levels.forEach(level => {
                const div = document.createElement('div');
                div.className = 'level-item';
                div.innerText = level;
                
                // إضافة وظيفة الحقل الحر
                div.onclick = function() {
                    document.getElementById('material-input-box').style.display = 'block';
                };
                container.appendChild(div);
            });
            
            document.getElementById('options-section').style.display = 'none';
            document.getElementById('detail-section').style.display = 'block';
        }

        function saveMaterial() {
            const material = document.getElementById('user-material').value;
            if(material) {
                document.getElementById('hidden-material').value = material;
                alert("تم حفظ المادة: " + material);
            } else {
                alert("يرجى كتابة اسم المادة!");
            }
        }
    </script>
