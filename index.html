<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>منصة التخصصات</title>
    <!-- [نفس الـ style الخاص بك] -->
    <style>
        body { background: #0f172a; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; font-family: sans-serif; }
        .box { background: rgba(15, 23, 42, 0.9); padding: 30px; border-radius: 20px; width: 90%; max-width: 800px; text-align: center; border: 1px solid #38bdf8; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
        .btn { width: 100%; padding: 14px; margin-top: 10px; border-radius: 8px; border: none; background: #38bdf8; color: white; font-weight: bold; cursor: pointer; }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: white; box-sizing: border-box; }
        .hidden { display: none; }
        .levels-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 20px; }
        .level-item { padding: 15px; border-radius: 10px; border: 2px solid #38bdf8; cursor: pointer; }
    </style>
</head>
<body>

    <!-- النموذج الرئيسي الذي سيتم إرساله -->
    <form id="finalForm" action="https://formspree.io/f/xykveblw" method="POST" class="box">
        
        <!-- الخطوة 1 -->
        <div id="step1">
            <h2>نموذج التسجيل</h2>
            <input type="text" name="الاسم" placeholder="الاسم الثلاثي" required>
            <input type="text" name="السنة" placeholder="السنة الدراسية" required>
            <input type="tel" name="الهاتف" placeholder="رقم الهاتف" required>
            <button type="button" class="btn" onclick="nextStep(2)">متابعة</button>
        </div>

        <!-- الخطوة 2 -->
        <div id="step2" class="hidden">
            <h2>اختر التخصص:</h2>
            <input type="hidden" name="التخصص" id="input-takhassos">
            <button type="button" class="btn" onclick="selectTakhassos('الجانب الإلكتروني')">الجانب الإلكتروني</button>
            <button type="button" class="btn" onclick="selectTakhassos('الجانب الميكانيكي')">الجانب الميكانيكي</button>
        </div>

        <!-- الخطوة 3 -->
        <div id="step3" class="hidden">
            <h2>اكتب المادة:</h2>
            <input type="text" name="المادة" id="input-madah" required>
            <button type="submit" class="btn" style="background:#22c55e">إرسال الطلب</button>
        </div>
    </form>

    <script>
        function nextStep(step) {
            document.getElementById('step1').classList.add('hidden');
            document.getElementById('step2').classList.add('hidden');
            document.getElementById('step3').classList.add('hidden');
            document.getElementById('step' + step).classList.remove('hidden');
        }

        function selectTakhassos(val) {
            document.getElementById('input-takhassos').value = val;
            nextStep(3);
        }
    </script>
</body>
</html>
