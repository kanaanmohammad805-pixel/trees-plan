<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نموذج GitHub الخاص بي</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 50px; background-color: #f4f4f9; text-align: center; }
        form { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); display: inline-block; width: 300px; text-align: right; }
        label { display: block; margin-top: 10px; font-weight: bold; }
        input, textarea { width: 100%; padding: 8px; margin-top: 5px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { background-color: #28a745; color: white; border: none; padding: 10px 15px; margin-top: 15px; width: 100%; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #218838; }
    </style>
</head>
<body>

    <h2>استبيان سريع</h2>
    
    <!-- ضع رابط Formspree الخاص بك في الـ action هنا -->
    <form action="https://formspree.io/f/ضع_رابط_الـ_ID_الخاص_بك_هنا" method="POST">
        
        <label for="name">الاسم:</label>
        <input type="text" id="name" name="الاسم" required>

        <label for="email">البريد الإلكتروني:</label>
        <input type="email" id="email" name="الايميل" required>

        <label for="message">رسالتك أو ملاحظاتك:</label>
        <textarea id="message" name="الرسالة" rows="4" required></textarea>

        <button type="submit">إرسال الإجابة</button>
    </form>

</body>
</html>
