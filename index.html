<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>منصة التخصصات</title>
    <style>
        body { background: #0f172a; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; font-family: sans-serif; }
        .box { background: rgba(15, 23, 42, 0.9); padding: 30px; border-radius: 20px; width: 90%; max-width: 800px; text-align: center; border: 1px solid #38bdf8; }
        input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: white; }
        .btn { width: 100%; padding: 14px; margin-top: 10px; border-radius: 8px; border: none; background: #38bdf8; color: white; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .hidden { display: none !important; } /* إخفاء إجباري */
        
        .levels-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 20px; }
        .level-item { padding: 15px; border-radius: 10px; border: 2px solid; cursor: pointer; font-weight: bold; transition: all 0.4s ease; }
        .level-item:hover { transform: translateY(-10px) scale(1.05); }
        .level-item:nth-child(1) { background: #1a4d46; border-color: #2d8a7d; }
        .level-item:nth-child(2) { background: #6b2121; border-color: #b91c1c; }
        .level-item:nth-child(3) { background: #71641a; border-color: #ca8a04; }
        .level-item:nth-child(4) { background: #4a2d5f; border-color: #7e22ce; }
        #material-input-box { margin-top: 20px; display: none; }
    </style>
</head>
<body>

    <div id="form-section" class="box">
        <form id="contactForm" action="https://formspree.io/f/xykveblw" method="POST">
            <h2>نموذج التسجيل</h2>
            <input type="text" name="الاسم" placeholder="الاسم الثلاثي" required>
            <input type="text" name="السنة" placeholder="السنة الدراسية" required>
            <input type="tel" name="الهاتف" placeholder="رقم الهاتف" required>
            <input type="email" name="الايميل" placeholder="البريد الإلكتروني" required>
            <input type="hidden" name="المادة_المختارة" id="hidden-material">
            <button type="submit" class="btn">إرسال البيانات</button>
        </form>
    </div>

    <div id="options-section" class="box hidden">
        <h2>اختر التخصص:</h2>
        <button class="btn" onclick="showOptions()">الجانب الإلكتروني</button>
    </div>

    <div id="detail-section" class="box hidden">
        <h2 id="detail-title"></h2>
        <div class="levels-grid" id="levels-container"></div>
        <div id="material-input-box">
            <input type="text" id="user-material" placeholder="اكتب اسم المادة...">
            <button class="btn" onclick="saveMaterial()">حفظ المادة</button>
        </div>
        <button class="btn" style="background:#475569" onclick="location.reload()">العودة</button>
    </div>

    <script>
        const form = document.getElementById('contactForm');
        
        // عند إرسال النموذج، ننتقل للاختيارات
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            document.getElementById('form-section').classList.add('hidden');
            document.getElementById('options-section').classList.remove('hidden');
        });

        function showOptions() {
            document.getElementById('options-section').classList.add('hidden');
            document.getElementById('detail-section').classList.remove('hidden');
            // هنا نحدد المستويات
            const container = document.getElementById('levels-container');
            ['Level 1-4', 'Level 2', 'Level 3', 'Level 4'].forEach(lvl => {
                const div = document.createElement('div');
                div.className = 'level-item';
                div.innerText = lvl;
                div.onclick = () => {
                    if(lvl === 'Level 3' || lvl === 'Level 4') alert("غير متاح");
                    else document.getElementById('material-input-box').style.display = 'block';
                };
                container.appendChild(div);
            });
        }

        function saveMaterial() {
            const mat = document.getElementById('user-material').value;
            if(mat) {
                document.getElementById('hidden-material').value = mat;
                alert("تم حفظ المادة، يمكنك الآن العودة وإكمال الإرسال أو إنهاء الطلب.");
            }
        }
    </script>
</body>
</html>
