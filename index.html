<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>منصة التخصصات</title>
    <style>
        body { background: #0f172a; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; font-family: sans-serif; }
        .box { background: rgba(15, 23, 42, 0.9); padding: 30px; border-radius: 20px; width: 90%; max-width: 800px; text-align: center; border: 1px solid #38bdf8; }
        .btn { width: 100%; padding: 14px; margin-top: 10px; border-radius: 8px; border: none; background: #38bdf8; color: white; font-weight: bold; cursor: pointer; }
        .detail-img { width: 100%; max-width: 600px; border-radius: 12px; margin: 20px auto; border: 3px solid #38bdf8; display: block; }
        .hidden { display: none; }

        /* تنسيق صناديق المستويات مع الألوان المخصصة */
        .levels-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 20px; }
        .level-item { padding: 15px; border-radius: 10px; border: 2px solid; cursor: pointer; font-weight: bold; transition: 0.3s; }
        
        .level-item:nth-child(1) { background: #1a4d46; border-color: #2d8a7d; }
        .level-item:nth-child(2) { background: #6b2121; border-color: #b91c1c; }
        .level-item:nth-child(3) { background: #71641a; border-color: #ca8a04; }
        .level-item:nth-child(4) { background: #4a2d5f; border-color: #7e22ce; }
        .level-item:hover { opacity: 0.8; transform: scale(1.05); }
    </style>
</head>
<body>

    <div id="options-section" class="box">
        <h2>اختر التخصص:</h2>
        <button class="btn" onclick="showDetail('الجانب الإلكتروني', '111.png', ['Level 1-4', 'Level 2', 'Level 3', 'Level 4'])">الجانب الإلكتروني</button>
        <button class="btn" onclick="showDetail('الجانب الميكانيكي', '3333.png', ['Level 1-4', 'Level 2', 'Level 3', 'Level 4'])">الجانب الميكانيكي</button>
        <button class="btn" onclick="showDetail('الجانب البرمجي', '2222.png', ['Level 1-4', 'Level 2', 'Level 3', 'Level 4'])">الجانب البرمجي</button>
    </div>

    <div id="detail-section" class="box hidden">
        <h2 id="detail-title"></h2>
        <img id="detail-image" src="" class="detail-img">
        <div class="levels-grid" id="levels-container"></div>
        <button class="btn" style="background:#475569; margin-top:20px" onclick="location.reload()">العودة</button>
    </div>

    <script>
        function showDetail(title, imgSrc, levels) {
            document.getElementById('detail-title').innerText = title;
            document.getElementById('detail-image').src = imgSrc;
            const container = document.getElementById('levels-container');
            container.innerHTML = '';
            levels.forEach(level => {
                const div = document.createElement('div');
                div.className = 'level-item';
                div.innerText = level;
                container.appendChild(div);
            });
            document.getElementById('options-section').style.display = 'none';
            document.getElementById('detail-section').style.display = 'block';
        }
    </script>
</body>
</html>
