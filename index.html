<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نموذج التسجيل والمتابعة</title>
    <style>
        /* إعدادات الخلفية */
        body { 
            background-image: url('2222.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            color: white; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        .box { 
            background: rgba(15, 23, 42, 0.85); /* خلفية داكنة شفافة */
            padding: 30px; 
            border-radius: 20px; 
            width: 320px; 
            text-align: center; 
            box-shadow: 0 10px 32px rgba(0,0,0,0.7);
            backdrop-filter: blur(6px); /* تأثير زجاجي */
            border: 1px solid rgba(255,255,255,0.1);
        }

        input { 
            width: 100%; 
            padding: 12px; 
            margin: 10px 0; 
            border-radius: 8px; 
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.1); 
            color: white; 
            box-sizing: border-box; 
        }

        button, .btn { 
            width: 100%; 
            padding: 14px; 
            margin-top: 10px; 
            border-radius: 8px; 
            border: none; 
            background: #38bdf8; 
            color: #0f172a; 
            font-weight: bold; 
            cursor: pointer; 
            text-decoration: none; 
            display: block; 
            font-size: 16px;
        }

        .btn { background: #38bdf8; color: white; margin-top: 15px; }
        .hidden { display: none; }
        h2 { margin-bottom: 20px; color: #ffffff; text-shadow: 2px 2px 8px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

    <div id="form-section" class="box">
        <form id="contactForm" action="https://formspree.io/f/xykveblw" method="POST">
            <h2>نموذج التسجيل</h2>
            <input type="text" name="الاسم" placeholder="الاسم الثلاثي" required>
            <input type="text" name="السنة" placeholder="السنة الدراسية" required>
            <input type="tel" name="الهاتف" placeholder="رقم الهاتف" required>
            <input type="email" name="الايميل" placeholder="البريد الإلكتروني" required>
            <button type="submit">متابعة إلى الاختيارات</button>
        </form>
    </div>

    <div id="options-section" class="box hidden">
        <h2>اختر التخصص:</h2>
        <a href="electronics.html" class="btn">الجانب الإلكتروني</a>
        <a href="mechanical.html" class="btn">الجانب الميكانيكي</a>
        <a href="programming.html" class="btn">الجانب البرمجي</a>
    </div>

    <script>
        const form = document.getElementById('contactForm');
        form.addEventListener('submit', function(e) {
            e.preventDefault(); 
            fetch(form.action, { method: 'POST', body: new FormData(form) });
            document.getElementById('form-section').classList.add('hidden');
            document.getElementById('options-section').classList.remove('hidden');
        });
    </script>
</body>
</html>
