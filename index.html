<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نموذج التسجيل والمتابعة</title>
    <style>
        /* إعدادات الخلفية والتوسيط */
        body { 
            background-image: url('2222.png');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: white;
        }
        
        /* الصندوق الرئيسي */
        .box { 
            background: rgba(15, 23, 42, 0.9); 
            padding: 30px; 
            border-radius: 20px; 
            width: 350px; 
            text-align: center; 
            box-shadow: 0 10px 32px rgba(0,0,0,0.8);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* تنسيق المدخلات */
        input { 
            width: 100%; 
            padding: 12px; 
            margin: 10px 0; 
            border-radius: 8px; 
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.1); 
            color: white; 
            box-sizing: border-box; 
            outline: none;
        }

        /* تنسيق الأزرار */
        button, .btn { 
            width: 100%; 
            padding: 14px; 
            margin-top: 10px; 
            border-radius: 8px; 
            border: none; 
            background: #38bdf8; 
            color: #0f172a; 
            font-weight: bold; 
            cursor: pointer; 
            text-decoration: none; 
            display: block; 
            font-size: 16px;
            transition: 0.3s;
        }

        button:hover, .btn:hover { background: #7dd3fc; transform: scale(1.02); }

        /* تنسيق الصور في الصفحة الثالثة */
        .detail-img {
            width: 100%;
            border-radius: 12px;
            margin-bottom: 15px;
            border: 2px solid #38bdf8;
        }

        .hidden { display: none; }
        h2 { margin-bottom: 20px; text-shadow: 2px 2px 10px rgba(0,0,0,0.5); }
        
        .back-link {
            display: inline-block;
            margin-top: 15px;
            color: #38bdf8;
            cursor: pointer;
            text-decoration: underline;
            font-size: 14px;
        }
    </style>
</head>
<body>

    <div id="form-section" class="box">
        <form id="contactForm" action="https://formspree.io/f/xykveblw" method="POST">
            <h2>نموذج التسجيل</h2>
            <input type="text" name="الاسم" placeholder="الاسم الثلاثي" required>
            <input type="text" name="السنة" placeholder="السنة الدراسية" required>
            <input type="tel" name="الهاتف" placeholder="رقم الهاتف" required>
            <input type="email" name="الايميل" placeholder="البريد الإلكتروني" required>
            <button type="submit">متابعة إلى الاختيارات</button>
        </form>
    </div>

    <div id="options-section" class="box hidden">
        <h2>اختر التخصص:</h2>
        <button class="btn" onclick="showDetail('الجانب الإلكتروني', 'elec_img.png')">الجانب الإلكتروني</button>
        <button class="btn" onclick="showDetail('الجانب الميكانيكي', 'mech_img.png')">الجانب الميكانيكي</button>
        <button class="btn" onclick="showDetail('الجانب البرمجي', 'prog_img.png')">الجانب البرمجي</button>
    </div>

    <div id="detail-section" class="box hidden">
        <h2 id="detail-title"></h2>
        <img id="detail-image" src="" alt="المحتوى" class="detail-img">
        <button class="btn" onclick="goBackToOptions()">العودة للاختيارات</button>
    </div>

    <script>
        const form = document.getElementById('contactForm');

        // عند إرسال النموذج (المرحلة 1 إلى 2)
        form.addEventListener('submit', function(e) {
            e.preventDefault(); 
            // إرسال البيانات مخفياً إلى Formspree
            fetch(form.action, { method: 'POST', body: new FormData(form) });
            
            // الانتقال للمرحلة الثانية
            document.getElementById('form-section').classList.add('hidden');
            document.getElementById('options-section').classList.remove('hidden');
        });

        // وظيفة إظهار الصورة (المرحلة 2 إلى 3)
        function showDetail(title, imgSrc) {
            document.getElementById('111').innerText = title;
            document.getElementById('3333').src = imgSrc; // هنا يوضع اسم الصورة
            
            document.getElementById('options-section').classList.add('hidden');
            document.getElementById('detail-section').classList.remove('hidden');
        }

        // العودة من الصورة إلى الاختيارات
        function goBackToOptions() {
            document.getElementById('detail-section').classList.add('hidden');
            document.getElementById('options-section').classList.remove('hidden');
        }
    </script>
</body>
</html>
