<script>
    // تخزين بيانات النموذج الأولي في متغير
    let formData = {};

    const form = document.getElementById('contactForm');
    form.addEventListener('submit', function(e) {
        e.preventDefault();
        // حفظ بيانات المستخدم في الكائن
        const data = new FormData(form);
        data.forEach((value, key) => { formData[key] = value; });
        
        document.getElementById('form-section').style.display = 'none';
        document.getElementById('options-section').style.display = 'block';
    });

    function showDetail(title, imgSrc, levels) {
        formData['التخصص'] = title; // إضافة التخصص للبيانات
        document.getElementById('detail-title').innerText = title;
        document.getElementById('detail-image').src = imgSrc;
        const container = document.getElementById('levels-container');
        container.innerHTML = '';
        
        levels.forEach(level => {
            const div = document.createElement('div');
            div.className = 'level-item';
            div.innerText = level;
            div.onclick = function() {
                const inputBox = document.getElementById('material-input-box');
                if (level === 'Level 3' || level === 'Level 4') {
                    alert("عذراً، هذا المستوى غير متاح الآن.");
                    inputBox.style.display = 'none';
                } else {
                    formData['المستوى'] = level; // حفظ المستوى
                    inputBox.style.display = 'block';
                }
            };
            container.appendChild(div);
        });
        document.getElementById('options-section').style.display = 'none';
        document.getElementById('detail-section').style.display = 'block';
    }

    function saveMaterial() {
        const mat = document.getElementById('user-material').value;
        if(mat) {
            formData['المادة_المختارة'] = mat;
            
            // إرسال البيانات النهائية إلى Formspree
            fetch('https://formspree.io/f/xykveblw', {
                method: 'POST',
                body: JSON.stringify(formData),
                headers: { 'Accept': 'application/json', 'Content-Type': 'application/json' }
            })
            .then(() => {
                alert("تم إرسال طلبك بنجاح!");
                location.reload();
            });
        } else {
            alert("يرجى كتابة اسم المادة");
        }
    }
</script>
