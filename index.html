<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خطة البرمجة - تجميع البيانات</title>
    <style>
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            /* هنا تم وضع رابط الصورة التي أرسلتها لتعمل كخلفية كاملة */
            background-image: url('https://images.squarespace-cdn.com/content/v1/660c15926ff91965f7001407/04e8d38e-0b01-49b0-bc37-cf136005ae65/2222.png'); 
            background-size: cover; 
            background-position: center;
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        
        .container {
            text-align: center;
            padding: 20px;
        }

        h2 {
            color: #ffffff;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.8);
            margin-bottom: 20px;
            font-size: 28px;
        }

        form { 
            background: rgba(15, 23, 42, 0.85); /* خلفية داكنة شفافة تتماشى مع ثيم الفضاء الأزرق */
            padding: 30px; 
            border-radius: 16px; 
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            backdrop-filter: blur(4px); /* تأثير ضبابي زجاجي رائع */
            -webkit-backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: inline-block; 
            width: 350px; 
            text-align: right; 
        }

        label { 
            display: block; 
            margin-top: 15px; 
            font-weight: bold; 
            color: #e2e8f0;
            font-size: 14px;
        }

        input, textarea { 
            width: 100%; 
            padding: 12px; 
            margin-top: 6px; 
            box-sizing: border-box; 
            border: 1px solid rgba(255, 255, 255, 0.2); 
            border-radius: 8px; 
            font-size: 14px;
            background: rgba(255, 255, 255, 0.1);
            color: #ffffff;
        }

        input::placeholder, textarea::placeholder {
            color: #94a3b8;
        }

        input:focus, textarea:focus {
            outline: none;
            border-color: #38bdf8; /* لون أزرق نيوني عند الكتابة يطابق التصميم */
            background: rgba(255, 255, 255, 0.15);
        }

        button { 
            background: linear-gradient(135px, #0284c7 0%, #0369a1 100%);
            color: white; 
            border: none; 
            padding: 14px 15px; 
            margin-top: 25px; 
            width: 100%; 
            border-radius: 8px; 
            cursor: pointer; 
            font-size: 16px; 
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(3, 105, 161, 0.3);
        }

        button:hover { 
            background: linear-gradient(135px, #0ea5e9 0%, #0284c7 100%);
            transform: translateY(-1px);
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>نموذج التسجيل والمتابعة</h2>
        
        <form action="https://formspree.io/f/xykveblw" method="POST">
            
            <label for="name">الاسم الكامل:</label>
            <input type="text" id="name" name="الاسم" placeholder="أدخل اسمك هنا" required>

            <label for="email">البريد الإلكتروني:</label>
            <input type="email" id="email" name="الايميل" placeholder="your-email@example.com" required>

            <label for="message">الرسالة أو الرد:</label>
            <textarea id="message" name="الرسالة" rows="4" placeholder="اكتب ملاحظاتك أو مستواك الحالي هنا..." required></textarea>

            <button type="submit">إرسال البيانات</button>
        </form>
    </div>

</body>
</html>
