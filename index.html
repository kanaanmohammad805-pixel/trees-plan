<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>منصة التخصصات</title>
    <style>
        body { 
            background-image: url('nm.png'); /* تأكد من صحة مسار الصورة */
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            font-family: sans-serif;
        }

        /* تنسيق الصندوق ليظهر بوضوح فوق الصورة */
        .box { 
            background: rgba(255, 255, 255, 0.9); 
            padding: 30px; 
            border-radius: 20px; 
            width: 90%; 
            max-width: 500px; 
            text-align: center; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .btn { 
            width: 100%; padding: 14px; margin-top: 10px; border-radius: 8px; border: none; background: #38bdf8; color: white; font-weight: bold; cursor: pointer; 
            transition: all 0.3s ease; 
        }
        .btn:hover { background: #0ea5e9; transform: scale(1.02); }

        input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #ccc; box-sizing: border-box; }

        .hidden { display: none; }
        .detail-img { width: 100%; max-width: 300px; border-radius: 12px; margin: 10px auto; border: 3px solid #38bdf8; display: block; }
        .levels-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 20px; }
        .level-item { padding: 15px; border-radius: 10px; border: 2px solid #38bdf8; cursor: pointer; font-weight: bold; }
        #material-input-box { margin-top: 20px; display: none; }
    </style>
</head>
<body>

    <div id="form-section" class="box">
        <form id="contactForm" action="https://formspree.io/f/xykveblw" method="POST">
            <h2>نموذج التسجيل</h2>
            <input type="text" name="الاسم" placeholder="الاسم الثلاثي" required>
            <input type="text" name="السنة" placeholder="السنة الدراسية" required>
            <input type="tel" name="الهاتف" placeholder="رقم الهاتف" required>
            <input type="email" name="الايميل" placeholder="البريد الإلكتروني" required>
            
            <input type="hidden" name="التخصص" id="input-takhassos">
            <input type="hidden" name="المادة" id="input-material">
            
            <button type="submit" class="btn" style="display:none"></button> <button type="button" class="btn" onclick="nextStep()">متابعة</button>
        </form>
    </div>

    <div id="options-section" class="box hidden">
        <h2>اختر التخصص:</h2>
        <button class="btn" onclick="showDetail('الجانب الإلكتروني', '111.png')">الجانب الإلكتروني</button>
        <button class="btn" onclick="showDetail('الجانب الميكانيكي', '3333.png')">الجانب الميكانيكي</button>
        <button class="btn" onclick="showDetail('الجانب البرمجي', '2222.png')">الجانب البرمجي</button>
    </div>

    <div id="detail-section" class="box hidden">
        <h2 id="detail-title"></h2>
        <img id="detail-image" src="" class="detail-img">
        <div class="levels-grid" id="levels-container"></div>
        <div id="material-input-box">
            <input type="text" id="user-material" placeholder="اكتب اسم المادة...">
            <button class="btn" style="background:#22c55e" onclick="submitFinal()">إرسال التسجيل</button>
        </div>
        <button class="btn" style="background:#475569" onclick="location.reload()">العودة للبداية</button>
    </div>

    <script>
        function nextStep() {
            document.getElementById('form-section').style.display = 'none';
            document.getElementById('options-section').style.display = 'block';
        }

        function showDetail(title, imgSrc) {
            document.getElementById('input-takhassos').value = title;
            document.getElementById('detail-title').innerText = title;
            document.getElementById('detail-image').src = imgSrc;
            document.getElementById('options-section').style.display = 'none';
            document.getElementById('detail-section').style.display = 'block';
            
            const container = document.getElementById('levels-container');
            container.innerHTML = '';
            ['Level 1', 'Level 2', 'Level 3', 'Level 4'].forEach(lvl => {
                const div = document.createElement('div');
                div.className = 'level-item';
                div.innerText = lvl;
                div.onclick = () => {
                    if (lvl === 'Level 3' || lvl === 'Level 4') alert("غير متاح حالياً");
                    else document.getElementById('material-input-box').style.display = 'block';
                };
                container.appendChild(div);
            });
        }

        function submitFinal() {
            const mat = document.getElementById('user-material').value;
            if(!mat) return alert("اكتب اسم المادة");
            document.getElementById('input-material').value = mat;
            document.getElementById('contactForm').submit();
        }
    </script>
</body>
</html>
