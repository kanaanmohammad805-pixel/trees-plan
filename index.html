<script>
    // متغير لتخزين البيانات الأساسية
    let userData = {};

    const form = document.getElementById('contactForm');
    form.addEventListener('submit', function(e) {
        e.preventDefault();
        // حفظ بيانات النموذج الأول
        const formData = new FormData(form);
        userData = Object.fromEntries(formData.entries());
        
        document.getElementById('form-section').style.display = 'none';
        document.getElementById('options-section').style.display = 'block';
    });

    function showDetail(title, imgSrc, levels) {
        userData['التخصص'] = title; // إضافة التخصص
        document.getElementById('detail-title').innerText = title;
        document.getElementById('detail-image').src = imgSrc;
        
        const container = document.getElementById('levels-container');
        container.innerHTML = '';
        
        levels.forEach(level => {
            const div = document.createElement('div');
            div.className = 'level-item';
            div.innerText = level;
            div.onclick = function() {
                if (level === 'Level 3' || level === 'Level 4') {
                    alert("عذراً، هذا المستوى غير متاح الآن.");
                    document.getElementById('material-input-box').style.display = 'none';
                } else {
                    userData['المستوى'] = level;
                    document.getElementById('material-input-box').style.display = 'block';
                }
            };
            container.appendChild(div);
        });
        document.getElementById('options-section').style.display = 'none';
        document.getElementById('detail-section').style.display = 'block';
    }

    function saveMaterial() {
        const mat = document.getElementById('user-material').value;
        if(!mat) { alert("يرجى كتابة المادة"); return; }
        
        userData['المادة_المختارة'] = mat;

        // إرسال البيانات النهائية
        const finalForm = new FormData();
        for (let key in userData) {
            finalForm.append(key, userData[key]);
        }

        fetch('https://formspree.io/f/xykveblw', {
            method: 'POST',
            body: finalForm,
            headers: { 'Accept': 'application/json' }
        })
        .then(response => {
            if (response.ok) {
                alert("تم إرسال طلبك بنجاح!");
                location.reload();
            } else {
                alert("حدث خطأ، يرجى المحاولة مرة أخرى.");
            }
        });
    }
</script>
