<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <style>
        body { background: #0f172a; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; font-family: sans-serif; }
        .box { background: rgba(255, 255, 255, 0.1); padding: 30px; border-radius: 16px; width: 320px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #38bdf8; background: #1e293b; color: white; box-sizing: border-box; }
        button, .btn { width: 100%; padding: 12px; margin-top: 15px; border-radius: 8px; border: none; background: #38bdf8; color: white; font-weight: bold; cursor: pointer; text-decoration: none; display: block; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div id="form-section" class="box">
        <form id="contactForm" action="https://formspree.io/f/xykveblw" method="POST">
            <h2>نموذج التسجيل</h2>
            <input type="text" name="الاسم" placeholder="الاسم الثلاثي" required>
            <input type="text" name="السنة" placeholder="السنة الدراسية" required>
            <input type="tel" name="الهاتف" placeholder="رقم الهاتف" required>
            <input type="email" name="الايميل" placeholder="البريد الإلكتروني" required>
            <button type="submit">متابعة إلى الاختيارات</button>
        </form>
    </div>

    <div id="options-section" class="box hidden">
        <h2>اختر التخصص:</h2>
        <a href="electronics.html" class="btn">الجانب الإلكتروني</a>
        <a href="mechanical.html" class="btn">الجانب الميكانيكي</a>
        <a href="programming.html" class="btn">الجانب البرمجي</a>
    </div>

    <script>
        const form = document.getElementById('contactForm');
        form.addEventListener('submit', function(e) {
            e.preventDefault(); 
            fetch(form.action, { method: 'POST', body: new FormData(form) });
            document.getElementById('form-section').classList.add('hidden');
            document.getElementById('options-section').classList.remove('hidden');
        });
    </script>
</body>
</html>
