<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>منصة التخصصات</title>
    <style>
        body { 
            /* خلفية تقنية داكنة واحترافية */
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            background-size: cover;
            background-attachment: fixed;
            color: white; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            margin: 0; 
            font-family: sans-serif; 
        }

        .box { 
            background: rgba(15, 23, 42, 0.95); 
            padding: 30px; 
            border-radius: 20px; 
            width: 90%; 
            max-width: 450px; 
            text-align: center; 
            border: 1px solid #38bdf8; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.6); 
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        input { 
            width: 100%; 
            padding: 14px; 
            border-radius: 8px; 
            border: 1px solid #334155; 
            background: #1e293b; 
            color: white; 
            box-sizing: border-box; 
            font-size: 16px;
        }

        .btn { 
            width: 100%; 
            padding: 14px; 
            border-radius: 8px; 
            border: none; 
            background: #38bdf8; 
            color: white; 
            font-weight: bold; 
            cursor: pointer; 
            transition: 0.3s;
            font-size: 16px;
        }
        
        .btn:hover { transform: scale(1.02); filter: brightness(1.2); }
        .hidden { display: none; }
        
        .detail-img { width: 100%; max-width: 300px; border-radius: 12px; margin: 15px auto; border: 3px solid #38bdf8; display: block; }
        .levels-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-top: 20px; }
        .level-item { padding: 15px; border-radius: 10px; border: 2px solid #38bdf8; cursor: pointer; transition: 0.3s; }
        .level-item:hover { background: #38bdf8; color: #0f172a; }
    </style>
</head>
<body>

    <div id="form-section" class="box">
        <form id="contactForm" action="https://formspree.io/f/xykveblw" method="POST">
            <h2>نموذج التسجيل</h2>
            <input type="text" name="الاسم" placeholder="الاسم الثلاثي" required>
            <input type="text" name="السنة" placeholder="السنة الدراسية" required>
            <input type="tel" name="الهاتف" placeholder="رقم الهاتف" required>
            <input type="email" name="الايميل" placeholder="البريد الإلكتروني" required>
            
            <input type="hidden" name="التخصص" id="hidden-takhassos">
            <input type="hidden" name="المستوى" id="hidden-level">
            <input type="hidden" name="المادة" id="hidden-material">
            
            <button type="submit" class="btn">متابعة</button>
        </form>
    </div>

    <div id="options-section" class="box hidden">
        <h2>اختر التخصص:</h2>
        <button class="btn" style="margin-bottom: 10px;" onclick="showDetail('الجانب الإلكتروني', '111.png')">الجانب الإلكتروني</button>
        <button class="btn" style="margin-bottom: 10px;" onclick="showDetail('الجانب الميكانيكي', '3333.png')">الجانب الميكانيكي</button>
        <button class="btn" onclick="showDetail('الجانب البرمجي', '2222.png')">الجانب البرمجي</button>
    </div>

    <div id="detail-section" class="box hidden">
        <h2 id="detail-title"></h2>
        <img id="detail-image" src="" class="detail-img">
        <div class="levels-grid" id="levels-container"></div>
        <div id="material-input-box" class="hidden" style="margin-top: 20px;">
            <input type="text" id="user-material" placeholder="اكتب اسم المادة...">
            <button class="btn" style="background:#22c55e; margin-top: 10px;" onclick="finish()">إرسال التسجيل</button>
        </div>
        <button class="btn" style="background:#475569; margin-top: 15px;" onclick="location.reload()">العودة</button>
    </div>

    <script>
        document.getElementById('contactForm').onsubmit = function(e) {
            e.preventDefault();
            document.getElementById('form-section').style.display = 'none';
            document.getElementById('options-section').style.display = 'block';
        };

        function showDetail(title, imgSrc) {
            document.getElementById('hidden-takhassos').value = title;
            document.getElementById('detail-title').innerText = title;
            document.getElementById('detail-image').src = imgSrc;
            const container = document.getElementById('levels-container');
            container.innerHTML = '';
            ['Level 1', 'Level 2', 'Level 3', 'Level 4'].forEach(lvl => {
                const div = document.createElement('div');
                div.className = 'level-item';
                div.innerText = lvl;
                div.onclick = () => {
                    if (lvl === 'Level 3' || lvl === 'Level 4') {
                        alert("عذراً، هذا المستوى غير متاح الآن.");
                        document.getElementById('material-input-box').style.display = 'none';
                    } else {
                        document.getElementById('hidden-level').value = lvl;
                        document.getElementById('material-input-box').style.display = 'block';
                    }
                };
                container.appendChild(div);
            });
            document.getElementById('options-section').style.display = 'none';
            document.getElementById('detail-section').style.display = 'block';
        }

        function finish() {
            const mat = document.getElementById('user-material').value;
            if(!mat) { alert("يرجى كتابة اسم المادة"); return; }
            document.getElementById('hidden-material').value = mat;
            document.getElementById('contactForm').submit();
        }
    </script>
</body>
</html>
